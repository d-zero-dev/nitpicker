[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
repository = "https://github.com/d-zero-dev/nitpicker"

[workspace.dependencies]
nitpicker_html_parser = { path = "crates/nitpicker_html_parser" }
nitpicker_html_scan = { path = "crates/nitpicker_html_scan" }
nitpicker_tech_detect = { path = "crates/nitpicker_tech_detect" }
nitpicker_template_cluster = { path = "crates/nitpicker_template_cluster" }
nitpicker_union_find = { path = "crates/nitpicker_union_find" }
nitpicker_url_key = { path = "crates/nitpicker_url_key" }
napi = { version = "3.14.2", default-features = false, features = ["napi8"] }
napi-build = "2.6.0"
napi-derive = "3.6.12"
aho-corasick = "1.1.5"
form_urlencoded = "1.2.2"
indexmap = "2.14.2"
lz4_flex = { version = "0.13.0", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
memchr = { version = "2.8.3", default-features = false, features = ["std"] }
proptest = "1.12.0"
rayon = "1.12.0"
regex = "1.13.1"
# Iteration order of its maps and sets is unspecified and may change with a
# version bump; nothing whose order reaches stored output iterates one (the
# template classifier's order-sensitive maps are `indexmap`), so bumping it
# cannot change template keys.
rustc-hash = "2.1.3"
serde_json = "1.0.154"
sha2 = "0.11.1"
url = "2.5.8"
zstd = { version = "0.14.3", default-features = false }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# `yarn build` (local, CI tests, E2E) uses the default `release` profile.
# Published binaries use `dist` (.github/workflows/build-core.yml): fat LTO
# with one codegen unit is worth its compile time only for what ships.
[profile.dist]
inherits = "release"
codegen-units = 1
lto = true
strip = "symbols"
