[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
repository = "https://github.com/d-zero-dev/nitpicker"

[workspace.dependencies]
nitpicker_html_scan = { path = "crates/nitpicker_html_scan" }
napi = { version = "3.14.2", default-features = false, features = ["napi8"] }
napi-build = "2.6.0"
napi-derive = "3.6.12"
regex = "1.13.1"
serde_json = "1.0.151"
sha2 = "0.11.0"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# `yarn build` (local, CI tests, E2E) uses the default `release` profile.
# Published binaries use `dist` (.github/workflows/build-core.yml): fat LTO
# with one codegen unit is worth its compile time only for what ships.
[profile.dist]
inherits = "release"
codegen-units = 1
lto = true
strip = "symbols"
