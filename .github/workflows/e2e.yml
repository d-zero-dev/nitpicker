name: E2E

# Full E2E suite (Puppeteer-driven, maxWorkers:1), run as a single job after
# `build`. A single job needs no list of files to keep in step with the files on
# disk: `vitest.e2e.config.ts` includes every `*.e2e.ts` under
# `packages/test-server/src/__tests__/e2e/`, so a new file runs in CI as soon as
# it exists. Narrowing that `include` would bring back the risk of a file that
# silently never runs.
#
# The vitest run takes about 7 minutes; the 15-minute job timeout also covers
# install, cache restore and Chrome setup. When the job gets close to the
# timeout, split it into matrix shards and add a step that diffs
# `find ... -name '*.e2e.ts'` against the file names listed in this workflow, so
# a file left out of the lists fails CI instead of silently never running.
# Sharding only spreads files across jobs: a single file that alone approaches
# the timeout has to be made faster itself.
#
# Triggers:
#   - nightly via cron (catch regressions on the default branch)
#   - on demand via workflow_dispatch
#   - on PRs that touch the CLI, test-server, or any package the CLI depends on
#     (path filter; mcp-server is not a CLI dependency, so it is excluded)
on:
  schedule:
    - cron: '0 18 * * *' # 03:00 JST, nightly
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/@nitpicker/archive/**'
      - 'packages/@nitpicker/cli/**'
      - 'packages/@nitpicker/core/**'
      - 'packages/@nitpicker/crawler/**'
      - 'packages/@nitpicker/query/**'
      - 'packages/@nitpicker/report-google-sheets/**'
      - 'packages/@nitpicker/report-html/**'
      - 'packages/@nitpicker/viewer/**'
      - 'packages/test-server/**'
      - 'vitest.e2e.config.ts'
      - 'rust-toolchain.toml'
      - '.github/workflows/e2e.yml'

# A new push to the same ref supersedes any in-flight run.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node 26 dropped the bundled corepack, so install it explicitly first.
      - run: npm install -g corepack
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.1
          cache: yarn
      - run: yarn install --immutable
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: yarn build
      # Cache the build output keyed by commit SHA. A re-run of the same SHA
      # (e.g. retry after a flaky E2E run) reuses this cache and skips the ~2 min
      # build. hashFiles-based keys are tempting for cross-commit reuse but
      # caused build/e2e key mismatch when the build step generated *.d.ts
      # files that flipped `hashFiles('packages/**/*.ts')` between save & restore.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The native addon lands outside lib/ (`core.<platform>.node`).
          path: |
            packages/**/lib
            packages/@nitpicker/core/*.node
          key: e2e-build-node26-${{ github.sha }}
          enableCrossOsArchive: true

  e2e:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node 26 dropped the bundled corepack, so install it explicitly first.
      - run: npm install -g corepack
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.1
          cache: yarn
      - run: yarn install --immutable
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/**/lib
            packages/@nitpicker/core/*.node
          key: e2e-build-node26-${{ github.sha }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      # Puppeteer's browser download is a silent no-op on this runner (it creates an
      # empty cache folder without the binary), so skip it and drive the Chrome that
      # ubuntu-latest ships pre-installed via PUPPETEER_EXECUTABLE_PATH instead.
      - name: Use the runner's pre-installed Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium)"
          test -n "$CHROME"
          "$CHROME" --version
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"
      # ubuntu-latest (24.04) restricts unprivileged user namespaces via AppArmor,
      # which breaks Chromium's sandbox. Relax the restriction so the sandbox can
      # still start — this keeps the sandbox enabled rather than passing --no-sandbox.
      - name: Allow Chromium sandbox (unprivileged userns)
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - name: Run E2E
        run: yarn vitest run --config vitest.e2e.config.ts
