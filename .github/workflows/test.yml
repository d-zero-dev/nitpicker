name: Test

# The Minimum CI (rule 32). Required checks: ci-ok and lines-check.
# sync/** carries the merge of a release back to dev, tested before dev moves (rule 25).
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: ['sync/**']
  merge_group:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  commit-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: npm install --global corepack@0.36.0
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn release-automation commit-check --base ${{ github.base_ref }}

  lines-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: npm install --global corepack@0.36.0
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn release-automation lines-check

  ci-ok:
    if: always()
    needs: [checks, commit-check]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
