name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node 26 dropped the bundled corepack, so install it explicitly first.
      - run: npm install -g corepack
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.1
          cache: yarn
      - run: yarn install --immutable
      # Also compiles @nitpicker/core's native addon for this runner (cargo is
      # preinstalled on GitHub-hosted runners; the version comes from
      # rust-toolchain.toml). Published binaries are built separately by
      # build-core.yml against an older glibc.
      - run: yarn build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-output
          path: |
            packages/**/lib/
            packages/@nitpicker/core/*.node
          retention-days: 1

  # Release builds of the native addon (glibc 2.28 container + macOS), each
  # checked against the body-hash golden fixture on its own platform.
  core-prebuilt:
    uses: ./.github/workflows/build-core.yml

  # The platform packages must ship exactly their binary: place the
  # prebuilt artifacts as Publish does and inspect the would-be tarballs.
  core-platform-packages:
    needs: core-prebuilt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-darwin-arm64
          path: packages/@nitpicker/core-darwin-arm64/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-linux-x64-gnu
          path: packages/@nitpicker/core-linux-x64-gnu/
      - name: Check tarball contents
        run: |
          for platform in darwin-arm64 linux-x64-gnu; do
            dir="packages/@nitpicker/core-$platform"
            npm pack --dry-run --json "./$dir" > "pack-$platform.json"
            node -e '
              const [pack] = require(process.argv[1]);
              const files = pack.files.map((f) => f.path).sort();
              const expected = ["README.md", "core." + process.argv[2] + ".node", "package.json"];
              if (JSON.stringify(files) !== JSON.stringify(expected)) {
                console.error("unexpected tarball contents for " + process.argv[2] + ": " + files.join(", "));
                process.exit(1);
              }
              console.log(process.argv[2] + ": " + files.join(", "));
            ' "./pack-$platform.json" "$platform"
          done

  # Unit + golden tests of the Rust crates themselves (no Node involved).
  # rustfmt / clippy run in the lint job via `yarn lint:check`.
  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same command as `yarn test:rust`, run directly: cargo needs none of
      # the node_modules a `yarn install` would spend minutes on.
      - run: cargo test --manifest-path packages/@nitpicker/core/Cargo.toml --locked

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node 26 dropped the bundled corepack, so install it explicitly first.
      - run: npm install -g corepack
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.1
          cache: yarn
      - run: yarn install --immutable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output
          path: packages/
      - run: yarn test

  # Smoke run of every Rust-port baseline bench (scripts/bench-suite.mjs) on
  # the committed 2-page fixture: every case must run against the current
  # build and print its record. The values are not checked. Its own job so it
  # runs beside `test` instead of after it; the timeout bounds a hung bench,
  # which the suite has no per-case timeout for.
  bench-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node 26 dropped the bundled corepack, so install it explicitly first.
      - run: npm install -g corepack
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.1
          cache: yarn
      - run: yarn install --immutable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output
          path: packages/
      - run: yarn bench:smoke

  # Minimum-support check: the build artifact (tsc output) is Node-runtime
  # agnostic, so it's reused as-is from the node26 build rather than
  # rebuilding under node24 — this job only re-verifies runtime behavior
  # (native deps, engine floors) on the oldest supported major.
  test-node24:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: yarn
      - run: yarn install --immutable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output
          path: packages/
      - run: yarn test

  lint:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node 26 dropped the bundled corepack, so install it explicitly first.
      - run: npm install -g corepack
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.1
          cache: yarn
      - run: yarn install --immutable
      # Type-aware lint rules (e.g. @typescript-eslint/no-unnecessary-type-assertion)
      # resolve cross-package types from each package's built lib/*.d.ts. Without the
      # build artifact, `@nitpicker/*` types collapse to `any` and the rules misfire,
      # so the lint job must consume the build output just like the test job does.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output
          path: packages/
      - run: yarn lint:check
