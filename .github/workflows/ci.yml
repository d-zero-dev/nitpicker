name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - run: corepack enable
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.18.0
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: build-output
          path: packages/**/lib/
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - run: corepack enable
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.18.0
          cache: yarn
      - run: yarn install --immutable
      - uses: actions/download-artifact@v8.0.1
        with:
          name: build-output
          path: packages/
      - run: yarn test

  lint:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - run: corepack enable
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.18.0
          cache: yarn
      - run: yarn install --immutable
      # Type-aware lint rules (e.g. @typescript-eslint/no-unnecessary-type-assertion)
      # resolve cross-package types from each package's built lib/*.d.ts. Without the
      # build artifact, `@nitpicker/*` types collapse to `any` and the rules misfire,
      # so the lint job must consume the build output just like the test job does.
      - uses: actions/download-artifact@v8.0.1
        with:
          name: build-output
          path: packages/
      - run: yarn lint:check
