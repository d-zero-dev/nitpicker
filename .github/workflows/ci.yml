name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node 26 dropped the bundled corepack, so install it explicitly first.
      - run: npm install -g corepack
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: packages/**/lib/
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node 26 dropped the bundled corepack, so install it explicitly first.
      - run: npm install -g corepack
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: yarn
      - run: yarn install --immutable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: packages/
      - run: yarn test

  # Minimum-support check: the build artifact (tsc output) is Node-runtime
  # agnostic, so it's reused as-is from the node26 build rather than
  # rebuilding under node24 — this job only re-verifies runtime behavior
  # (native deps, engine floors) on the oldest supported major.
  test-node24:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: yarn
      - run: yarn install --immutable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: packages/
      - run: yarn test

  lint:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node 26 dropped the bundled corepack, so install it explicitly first.
      - run: npm install -g corepack
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: yarn
      - run: yarn install --immutable
      # Type-aware lint rules (e.g. @typescript-eslint/no-unnecessary-type-assertion)
      # resolve cross-package types from each package's built lib/*.d.ts. Without the
      # build artifact, `@nitpicker/*` types collapse to `any` and the rules misfire,
      # so the lint job must consume the build output just like the test job does.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: packages/
      - run: yarn lint:check
