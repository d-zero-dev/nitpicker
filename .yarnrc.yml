nodeLinker: node-modules
npmRegistryServer: 'https://registry.npmjs.org'
enableGlobalCache: true

# npm publish 後 7 日経過していないパッケージを依存解決から除外する
# サプライチェーン保護。typosquatting や即時 takedown が走ったパッケージを
# 取り込まないためのセーフティガード。
#
# 自社パッケージ（@d-zero/*）の publish 直後に取り込みたい場合は、本設定を
# 一時的にコメントアウトして `yarn install` → `yarn.lock` 固定後に **必ず復元
# してコミットする**。復元忘れがあるとリポジトリ全体で保護が外れ続けるため、
# レビューでは `.yarnrc.yml` の差分に注目すること。
#
# Yarn 4 リファレンス: https://yarnpkg.com/configuration/yarnrc#npmMinimalAgeGate
npmMinimalAgeGate: 7d
